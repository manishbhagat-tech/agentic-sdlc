name: Harness
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: harness-check
        run: |
          chmod +x scripts/*.sh hooks/*.sh
          ./scripts/harness-check.sh
