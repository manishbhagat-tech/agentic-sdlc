# Board adapter config — GitHub Projects (v1)

# Markdown under DOCS_ROOT remains source of truth.
# GitHub Issues + Project board are the **dashboard mirror** for US-* / BUG-*.

provider: github_projects
enabled: false

# Repository that owns issues (org/name) — usually the docs repo
repo: YOUR_ORG/your-docs

# GitHub user or org that owns the Project
project_owner: YOUR_ORG

# Project number (from Projects URL: /users/…/projects/N or /orgs/…/projects/N)
project_number: 1

# Project single-select field used for Status (default GitHub name)
status_field: Status

# Map markdown status → Project Status option names
status_map:
  draft: Backlog
  ready: Ready
  in_progress: In Progress
  in_review: In Review
  needs_human: Needs Human
  blocked: Blocked
  done: Done
  cancelled: Cancelled
  superseded: Cancelled

# Sync policy — keep false until Project Status options match status_map exactly
sync:
  status_from_board: false
  push_on_ready: true

# Title format for issues
title_template: "{id}: {title}"

# Labels (create these on the issues repo)
security_elevated_label: "security:elevated"
bug_label: bug
story_label: story

# Views to create manually in the Project UI (recommended dashboard)
# - Stories: filter label:story
# - Bugs: filter label:bug
# - Elevated: filter label:security:elevated
# - By status: board grouped by Status
